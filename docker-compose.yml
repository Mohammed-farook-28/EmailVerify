services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: emailkit
      POSTGRES_PASSWORD: emailkit
      POSTGRES_DB: emailkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailkit"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://emailkit:emailkit@postgres:5432/emailkit
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  workers-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "./scripts/run-core-workers.sh"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://emailkit:emailkit@postgres:5432/emailkit
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: development
      UPSTREAM_API_URL: http://mock-upstream:8080
    depends_on:
      backend:
        condition: service_healthy

  workers-cron:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "./scripts/run-cron-workers.sh"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://emailkit:emailkit@postgres:5432/emailkit
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: development
    depends_on:
      backend:
        condition: service_healthy

  mock-upstream:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: ["node", "dist/mock-upstream-api.js"]
    environment:
      NODE_ENV: development

volumes:
  pgdata:
  redisdata:
